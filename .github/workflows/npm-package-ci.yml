name: NPM Package CI

on:
  push:
    branches:
      - main
    paths:
      - "npm/y-phoenix-channel/**"
      - ".github/workflows/npm-package-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "npm/y-phoenix-channel/**"
      - ".github/workflows/npm-package-ci.yml"

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  verify:
    name: Verify package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: npm/y-phoenix-channel
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: npm/y-phoenix-channel/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: npm/y-phoenix-channel

      - name: Type check
        run: npm run typecheck
        working-directory: npm/y-phoenix-channel

      - name: Build
        run: npm run build
        working-directory: npm/y-phoenix-channel

      - name: Run tests
        run: npm test -- --run
        working-directory: npm/y-phoenix-channel
